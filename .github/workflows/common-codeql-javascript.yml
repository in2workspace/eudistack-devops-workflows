name: common-codeql-javascript

on:
  workflow_call:
    inputs:
      languages:
        description: CodeQL languages to analyze
        required: false
        type: string
        default: javascript-typescript
      queries:
        description: CodeQL query suite
        required: false
        type: string
        default: security-extended

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: ${{ inputs.languages }}
          queries: ${{ inputs.queries }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          category: '/language:javascript-typescript'

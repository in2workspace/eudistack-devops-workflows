name: Set up EUDIStack delivery scripts
description: Expose common and platform-specific delivery scripts to subsequent workflow steps

runs:
  using: composite
  steps:
    - name: Export scripts path
      shell: bash
      env:
        SCRIPTS_ROOT: ${{ github.action_path }}/../../../scripts
      run: |
        echo "EUDISTACK_DEVOPS_SCRIPTS=${SCRIPTS_ROOT}" >> "${GITHUB_ENV}"
        echo "EUDISTACK_DEVOPS_COMMON_SCRIPTS=${SCRIPTS_ROOT}/common" >> "${GITHUB_ENV}"
        echo "EUDISTACK_DEVOPS_ECS_API_SCRIPTS=${SCRIPTS_ROOT}/ecs-api" >> "${GITHUB_ENV}"
        echo "EUDISTACK_DEVOPS_REPOSITORY_SCRIPTS=${SCRIPTS_ROOT}/repository" >> "${GITHUB_ENV}"
